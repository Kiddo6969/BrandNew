<script>
(function () {
  "use strict";

  /* ======================================================================
     KONFIGURACJA — UZUPEŁNIJ SWOIMI DANYMI I CENAMI
     ====================================================================== */
  var CONFIG = {
    phone: "+48000000000",          // do linków tel: i sms:
    phoneDisplay: "000 000 000",    // wyświetlany numer
    instagram: "brandnew_serwis",   // sam login, bez @
    facebook: "brandnew.serwis",    // nazwa strony FB (m.me/NAZWA)
    email: "kontakt@twojadomena.pl"
  };

  // Ceny katalogowe (zł). Pakiet Kryo = Pro + 40 zł.
  var CATEGORIES = {
    laptops:  { label: "Laptop",   basic: 119, pro: 199, feat: "Czyszczenie wentylatorów i radiatora laptopa" },
    gpu:      { label: "Karta GPU", basic: 129, pro: 219, feat: "Demontaż chłodzenia GPU i czyszczenie radiatora" },
    handheld: { label: "Handheld PC", basic: 139, pro: 229, feat: "Rozkręcenie handhelda i czyszczenie wentylatora" }
  };
  var KRYO_EXTRA = 40;

  var SERVICES = [
    { id: "basic", badge: "Standard", title: "Pakiet Basic — Arctic MX-7",
      desc: "Dobry wybór do sprzętu biurowego i chłodniejszych układów.",
      feats: ["{cat}", "Nowa pasta Arctic MX-7", "Raport temperatur PRZED i PO"] },
    { id: "pro", badge: "Najczęściej wybierany", title: "Pakiet Pro — PTM7950 + Putty",
      desc: "Zmiennofazowy PTM na rdzeń i Putty na pamięci oraz VRM.",
      feats: ["{cat}", "Thermal Grizzly PhaseSheet PTM (PTM7950)", "Thermal Grizzly Putty Basic na VRAM / VRM", "Raport temperatur PRZED i PO"] },
    { id: "kryo", badge: "Rabat -25% na start", title: "Pakiet Kryo — KryoSheet + Putty",
      desc: "Grafenowy pad KryoSheet na rdzeń dla najmocniejszych układów.",
      feats: ["{cat}", "Thermal Grizzly KryoSheet (pad grafenowy)", "Thermal Grizzly Putty Basic na VRAM / VRM", "Raport temperatur PRZED i PO"] }
  ];

  /* ====================================================================== */
  var state = { view: "service", category: "laptops", service: "pro" };

  function $(id) { return document.getElementById(id); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /* ----- MOTYW JASNY / CIEMNY ----- */
  var root = document.documentElement;
  var themeBtn = $("themeToggleBtn");
  var themeLabel = $("themeToggleLabel");
  var themeBtnMobile = $("mobileThemeToggleBtn");

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    var dark = theme === "dark";
    if (themeLabel) themeLabel.textContent = dark ? "Jasny" : "Ciemny";
    if (themeBtn) {
      themeBtn.setAttribute("aria-pressed", String(dark));
      themeBtn.setAttribute("title", dark ? "Przełącz na tryb jasny" : "Przełącz na tryb ciemny");
    }
    if (themeBtnMobile) themeBtnMobile.textContent = dark ? "Przełącz na tryb jasny ☀️" : "Przełącz na tryb ciemny 🌙";
  }
  function toggleTheme() {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("bn_theme", next); } catch (e) {}
  }
  applyTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
  if (themeBtn) themeBtn.addEventListener("click", toggleTheme);
  if (themeBtnMobile) themeBtnMobile.addEventListener("click", function () { toggleTheme(); closeMenu(); });

  /* ----- MENU MOBILNE ----- */
  var menuBtn = $("menuToggle");
  var mobileMenu = $("mobileMenu");
  function closeMenu() {
    if (!mobileMenu) return;
    mobileMenu.classList.remove("open");
    if (menuBtn) menuBtn.setAttribute("aria-expanded", "false");
  }
  if (menuBtn) menuBtn.addEventListener("click", function () {
    var open = mobileMenu.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", String(open));
  });
  if (mobileMenu) mobileMenu.addEventListener("click", function (e) {
    if (e.target.closest("a, button")) closeMenu();
  });

  /* ----- PRZEŁĄCZANIE WIDOKÓW: SERWIS / PARTNER ----- */
  window.switchPageView = function (view) {
    state.view = view === "partner" ? "partner" : "service";
    $("view-service").classList.toggle("active", state.view === "service");
    $("view-partner").classList.toggle("active", state.view === "partner");
    qsa(".view-tab-btn").forEach(function (b) {
      var on = b.getAttribute("data-view") === state.view;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", String(on));
    });
    var nav = $("serviceSectionNav");
    if (nav) nav.style.visibility = state.view === "service" ? "" : "hidden";
    closeMenu();
    if (!location.hash || state.view === "partner") window.scrollTo({ top: 0, behavior: "smooth" });
  };

  /* ----- KALKULATOR ----- */
  function priceFor(cat, id) {
    var c = CATEGORIES[cat];
    if (id === "basic") return c.basic;
    if (id === "pro") return c.pro;
    return c.pro + KRYO_EXTRA;
  }
  function discountPct(base, id) {
    if (id === "kryo") return 25;
    if (base <= 150) return 15;
    if (base <= 260) return 20;
    return 25;
  }
  function calc(cat, id) {
    var base = priceFor(cat, id);
    var pct = discountPct(base, id);
    var off = Math.round(base * pct / 100);
    return { base: base, pct: pct, off: off, final: base - off };
  }

  function renderCards() {
    var cat = state.category;
    var catFeat = CATEGORIES[cat].feat;
    $("cardsGrid").innerHTML = SERVICES.map(function (s) {
      var r = calc(cat, s.id);
      var sel = state.service === s.id;
      var feats = s.feats.map(function (f) {
        return "<li>" + (f === "{cat}" ? catFeat : f) + "</li>";
      }).join("");
      return '<div class="service-card' + (sel ? " selected" : "") + '" data-id="' + s.id + '" role="button" tabindex="0" aria-pressed="' + sel + '">' +
        "<div>" +
        '<span class="card-badge">' + s.badge + "</span>" +
        '<h3 class="card-title">' + s.title + "</h3>" +
        '<div class="card-price-row">' +
        '<span class="price-final">' + r.final + " zł</span>" +
        '<span class="price-old">' + r.base + " zł</span>" +
        '<span class="discount-pill">-' + r.pct + "%</span>" +
        "</div>" +
        '<p class="card-desc">' + s.desc + "</p>" +
        '<ul class="card-features">' + feats + "</ul>" +
        "</div>" +
        '<button type="button" class="card-select-btn" tabindex="-1">' + (sel ? "Wybrano ✓" : "Wybierz pakiet") + "</button>" +
        "</div>";
    }).join("");
  }

  function buildMessage(r, svc) {
    var model = ($("deviceModelInput").value || "").trim() || "(do uzupełnienia)";
    return [
      "Cześć! Chcę zamówić serwis chłodzenia w BRAND NEW.",
      "",
      "Kategoria: " + CATEGORIES[state.category].label,
      "Usługa: " + svc.title,
      "Model: " + model,
      "Przekazanie: " + $("logisticsSelect").value,
      "",
      "Cena katalogowa: " + r.base + " zł",
      "Rabat na start (-" + r.pct + "%): -" + r.off + " zł",
      "Do zapłaty: " + r.final + " zł",
      "",
      "Proszę o potwierdzenie terminu."
    ].join("\n");
  }

  function updateSummary() {
    var svc = SERVICES.filter(function (s) { return s.id === state.service; })[0];
    var r = calc(state.category, state.service);
    $("summaryServiceName").textContent = svc.title;
    $("summaryBasePrice").textContent = r.base + " zł";
    $("summaryDiscountLabel").textContent = "Rabat na start (" + r.pct + "%):";
    $("summaryDiscountValue").textContent = "-" + r.off + " zł";
    $("summaryFinalPrice").textContent = r.final + " zł";
    $("kryoAddon").checked = state.service === "kryo";

    var msg = buildMessage(r, svc);
    $("generatedMessage").value = msg;
    var enc = encodeURIComponent(msg);
    var subj = encodeURIComponent("Zapytanie o serwis chłodzenia — BRAND NEW");
    $("igDirectBtn").href = "https://ig.me/m/" + CONFIG.instagram;
    $("fbDirectBtn").href = "https://m.me/" + CONFIG.facebook;
    $("smsDirectBtn").href = "sms:" + CONFIG.phone + "?&body=" + enc;
    $("mailDirectBtn").href = "mailto:" + CONFIG.email + "?subject=" + subj + "&body=" + enc;
  }

  function refresh() { renderCards(); updateSummary(); }

  function setCategory(cat) {
    if (!CATEGORIES[cat]) return;
    state.category = cat;
    qsa(".bn-tab").forEach(function (t) {
      var on = t.getAttribute("data-category") === cat;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", String(on));
    });
    $("handheldNotice").classList.toggle("visible", cat === "handheld");
    refresh();
  }

  qsa(".bn-tab").forEach(function (t) {
    t.addEventListener("click", function () { setCategory(t.getAttribute("data-category")); });
  });

  var grid = $("cardsGrid");
  function pickCard(e) {
    var card = e.target.closest(".service-card");
    if (!card) return;
    state.service = card.getAttribute("data-id");
    refresh();
  }
  grid.addEventListener("click", pickCard);
  grid.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickCard(e); }
  });

  $("kryoAddon").addEventListener("change", function () {
    state.service = this.checked ? "kryo" : "pro";
    refresh();
  });
  $("deviceModelInput").addEventListener("input", updateSummary);
  $("logisticsSelect").addEventListener("change", updateSummary);

  /* ----- KOPIOWANIE ----- */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }
  var copyBtn = $("copyMsgBtn");
  var copyBtnText = copyBtn.textContent;
  copyBtn.addEventListener("click", function () {
    copyText($("generatedMessage").value).then(function () {
      copyBtn.textContent = "Skopiowano ✓";
    }, function () {
      $("generatedMessage").select();
      copyBtn.textContent = "Zaznacz i skopiuj ręcznie";
    }).then(function () {
      setTimeout(function () { copyBtn.textContent = copyBtnText; }, 2000);
    });
  });
  // Przy wejściu na IG / FB wiadomość też trafia do schowka
  ["igDirectBtn", "fbDirectBtn"].forEach(function (id) {
    $(id).addEventListener("click", function () {
      copyText($("generatedMessage").value).catch(function () {});
    });
  });

  /* ----- KARUZELA INFO: WYSYŁKA / MATERIAŁY / REALIZACJA ----- */
  var slides = qsa(".info-slide");
  var pills = qsa(".info-pill-btn");
  var slideIdx = 0;
  function showSlide(i) {
    slideIdx = (i + slides.length) % slides.length;
    slides.forEach(function (s, n) { s.classList.toggle("active", n === slideIdx); });
    pills.forEach(function (p, n) { p.classList.toggle("active", n === slideIdx); });
  }
  $("infoPrevBtn").addEventListener("click", function () { showSlide(slideIdx - 1); });
  $("infoNextBtn").addEventListener("click", function () { showSlide(slideIdx + 1); });
  pills.forEach(function (p) {
    p.addEventListener("click", function () { showSlide(parseInt(p.getAttribute("data-slide-target"), 10)); });
  });

  var HUB_ANCHORS = { "#wysylka": 0, "#materialy": 1, "#proces": 2 };
  function goHub(hash) {
    if (!(hash in HUB_ANCHORS)) return false;
    showSlide(HUB_ANCHORS[hash]);
    $("info-hub").scrollIntoView({ behavior: "smooth", block: "start" });
    return true;
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (a && goHub(a.getAttribute("href"))) e.preventDefault();
  });

  /* ----- KONTAKT I MEDIA ----- */
  var ICONS = {
    phone: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    ig: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>',
    fb: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',
    mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>'
  };
  var CONTACTS = [
    { icon: "phone", label: "Telefon / SMS", value: CONFIG.phoneDisplay, href: "tel:" + CONFIG.phone, ext: false },
    { icon: "ig", label: "Instagram", value: "@" + CONFIG.instagram, href: "https://ig.me/m/" + CONFIG.instagram, ext: true },
    { icon: "fb", label: "Facebook", value: CONFIG.facebook, href: "https://m.me/" + CONFIG.facebook, ext: true },
    { icon: "mail", label: "E-mail", value: CONFIG.email, href: "mailto:" + CONFIG.email, ext: false }
  ];
  $("contactGrid").innerHTML = CONTACTS.map(function (c) {
    return '<a href="' + c.href + '"' + (c.ext ? ' target="_blank" rel="noopener"' : "") + ' class="contact-card">' +
      '<div class="contact-card-top"><span class="contact-icon-box">' + ICONS[c.icon] + '</span><span class="contact-arrow">↗</span></div>' +
      '<div><span class="contact-label">' + c.label + '</span><span class="contact-value">' + c.value + "</span></div></a>";
  }).join("");

  $("footerLinks").innerHTML = CONTACTS.map(function (c) {
    return '<a href="' + c.href + '"' + (c.ext ? ' target="_blank" rel="noopener"' : "") + ">" + c.label + "</a>";
  }).join("");

  /* ----- START ----- */
  setCategory("laptops");
  if (location.hash) setTimeout(function () { goHub(location.hash); }, 50);
})();
</script>
</body>
</html>
